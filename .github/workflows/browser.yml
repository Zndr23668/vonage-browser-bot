name: Vonage SMS Browser Bot

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL received by Vonage SMS
        required: true
        type: string

permissions:
  contents: read

jobs:
  browse:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Open URL with saved session and return results
        env:
          TARGET_URL: ${{ inputs.url }}
          MAKE_RESULT_WEBHOOK_URL: ${{ secrets.MAKE_RESULT_WEBHOOK_URL }}
          PLAYWRIGHT_STORAGE_STATE: ${{ secrets.PLAYWRIGHT_STORAGE_STATE }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const raw = process.env.TARGET_URL;
          let result;

          try {
            const url = new URL(raw);

            if (!['http:', 'https:'].includes(url.protocol)) {
              throw new Error('Only HTTP and HTTPS URLs are allowed.');
            }

            const host = url.hostname.toLowerCase();
            const isPrivateIPv4 = (() => {
              const parts = host.split('.').map(Number);
              if (parts.length !== 4 || parts.some(n => !Number.isInteger(n) || n < 0 || n > 255)) return false;
              const [a, b] = parts;
              return a === 10 || a === 127 || a === 0 ||
                (a === 169 && b === 254) ||
                (a === 172 && b >= 16 && b <= 31) ||
                (a === 192 && b === 168) ||
                (a === 100 && b >= 64 && b <= 127);
            })();

            if (
              ['localhost', '127.0.0.1', '::1'].includes(host) ||
              host.endsWith('.local') ||
              host.endsWith('.internal') ||
              isPrivateIPv4
            ) {
              throw new Error('Local or private network addresses are not allowed.');
            }

            let storageState;
            if (process.env.PLAYWRIGHT_STORAGE_STATE?.trim()) {
              try {
                storageState = JSON.parse(process.env.PLAYWRIGHT_STORAGE_STATE);
              } catch {
                throw new Error('PLAYWRIGHT_STORAGE_STATE secret is not valid JSON. Recreate the secret from a valid Playwright storageState.json file.');
              }
            }

            const browser = await chromium.launch({ headless: true });

            try {
              const context = await browser.newContext(
                storageState ? { storageState } : {}
              );
              const page = await context.newPage();
              const response = await page.goto(url.href, {
                waitUntil: 'domcontentloaded',
                timeout: 30000
              });

              const title = await page.title();
              const text = await page.locator('body')
                .innerText()
                .catch(() => '');

              result = {
                status: 'ok',
                requestedUrl: url.href,
                finalUrl: page.url(),
                httpStatus: response?.status() ?? null,
                title,
                authenticatedSessionLoaded: Boolean(storageState),
                text: text.slice(0, 5000)
              };

              await context.close();
            } finally {
              await browser.close();
            }
          } catch (error) {
            result = {
              status: 'error',
              requestedUrl: raw,
              error: String(error).slice(0, 1000)
            };
          }

          const callback = process.env.MAKE_RESULT_WEBHOOK_URL;

          if (callback) {
            const response = await fetch(callback, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(result)
            });

            if (!response.ok) {
              throw new Error(`Make callback failed: ${response.status}`);
            }
          }

          console.log(JSON.stringify(result));

          if (result.status === 'error') {
            process.exitCode = 1;
          }
          NODE
