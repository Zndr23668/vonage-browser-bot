name: Vonage SMS Browser Bot

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL received by Vonage SMS
        required: true
        type: string

permissions:
  contents: read

jobs:
  browse:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Open URL and return results
        env:
          TARGET_URL: ${{ inputs.url }}
          MAKE_RESULT_WEBHOOK_URL: ${{ secrets.MAKE_RESULT_WEBHOOK_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const raw = process.env.TARGET_URL;
          let result;

          try {
            const url = new URL(raw);

            if (!['http:', 'https:'].includes(url.protocol)) {
              throw new Error('Only HTTP and HTTPS URLs are allowed.');
            }

            if (
              ['localhost', '127.0.0.1', '::1'].includes(url.hostname) ||
              url.hostname.endsWith('.local')
            ) {
              throw new Error('Local addresses are not allowed.');
            }

            const browser = await chromium.launch({ headless: true });

            try {
              const page = await browser.newPage();
              const response = await page.goto(url.href, {
                waitUntil: 'domcontentloaded',
                timeout: 30000
              });

              const title = await page.title();
              const text = await page.locator('body')
                .innerText()
                .catch(() => '');

              result = {
                status: 'ok',
                requestedUrl: url.href,
                finalUrl: page.url(),
                httpStatus: response?.status() ?? null,
                title,
                text: text.slice(0, 5000)
              };
            } finally {
              await browser.close();
            }
          } catch (error) {
            result = {
              status: 'error',
              requestedUrl: raw,
              error: String(error).slice(0, 1000)
            };
          }

          const callback = process.env.MAKE_RESULT_WEBHOOK_URL;

          if (callback) {
            const response = await fetch(callback, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(result)
            });

            if (!response.ok) {
              throw new Error(`Make callback failed: ${response.status}`);
            }
          }

          console.log(JSON.stringify(result));

          if (result.status === 'error') {
            process.exitCode = 1;
          }
          NODE
